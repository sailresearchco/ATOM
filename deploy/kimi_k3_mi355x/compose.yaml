name: ${ATOM_COMPOSE_PROJECT:-sail-atom-k3}

services:
  server:
    image: ${ATOM_IMAGE:?set ATOM_IMAGE to an immutable image tag or digest}
    container_name: ${ATOM_CONTAINER_NAME:-sail-atom-k3}
    restart: unless-stopped
    init: true
    privileged: true
    network_mode: host
    ipc: host
    shm_size: 128gb
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      memlock: -1
      stack: 67108864
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      ATOM_ENABLE_PREFILL_DELAYER: ${ATOM_ENABLE_PREFILL_DELAYER:-0}
      ATOM_PREFILL_DECODE_INTERVAL: ${ATOM_PREFILL_DECODE_INTERVAL:-0}
    volumes:
      - ${ATOM_HF_CACHE_ROOT:-/home/sr/.cache}:/root/.cache:ro
      # Torch/ATOM compile artifacts must be writable and should survive a
      # container replacement. A nested bind overrides only this subtree.
      - ${ATOM_RUNTIME_CACHE_ROOT:-/home/sr/.cache/atom-runtime}:/root/.cache/atom
    command:
      - python
      - -m
      - atom.entrypoints.openai_server
      - --model
      - ${ATOM_TARGET_MODEL:-/root/.cache/huggingface/models--moonshotai--Kimi-K3/snapshots/9f62e4e9fffbd0a83ddd60e1c209d828994b3569-materialized}
      - --served-model-name
      - ${ATOM_SERVED_MODEL:-moonshotai/Kimi-K3}
      - --host
      - ${ATOM_HOST:-0.0.0.0}
      - --server-port
      - ${ATOM_SERVER_PORT:-31000}
      - --port
      - ${ATOM_ENGINE_PORT:-31100}
      - --kv_cache_dtype
      - fp8
      - -tp
      - "8"
      - -dcp
      - "8"
      - --trust-remote-code
      - --max-model-len
      - ${ATOM_MAX_MODEL_LEN:-16384}
      - --max-num-seqs
      - ${ATOM_MAX_NUM_SEQS:-32}
      - --max-num-batched-tokens
      - ${ATOM_MAX_NUM_BATCHED_TOKENS:-8192}
      - --num-continuous-decode-steps
      - ${ATOM_CONTINUOUS_DECODE_STEPS:-4}
      - --gpu-memory-utilization
      - ${ATOM_GPU_MEMORY_UTILIZATION:-0.85}
      - --block-size
      - "128"
      - --enable_prefix_caching
      - --disable-uvicorn-access-log
      - --timeout-keep-alive
      - ${ATOM_KEEP_ALIVE_SECONDS:-90}
      - --throughput-log-interval
      - "10"
      - --online_quant_config
      - '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'
      - --draft-model
      - ${ATOM_DRAFT_MODEL:-/root/.cache/huggingface/hub/models--Inferact--Kimi-K3-DSpark/snapshots/cf6b8244620e7ea4b0651d214f28e89eac75bed6}
      - --method
      - dspark
      - --num-speculative-tokens
      - ${ATOM_DSPARK_TOKENS:-4}
    healthcheck:
      test:
        - CMD
        - python
        - /opt/sail-atom/deploy/kimi_k3_mi355x/healthcheck.py
        - --base-url
        - http://127.0.0.1:${ATOM_SERVER_PORT:-31000}
        - --model
        - ${ATOM_SERVED_MODEL:-moonshotai/Kimi-K3}
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 25m
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
